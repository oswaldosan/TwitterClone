services:
  mysql:
    image: mysql:8.0
    container_name: writter-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: writter
      MYSQL_USER: writter
      MYSQL_PASSWORD: writter_secret
      MYSQL_ROOT_PASSWORD: writter_root
    ports:
      - "3306:3306"
    volumes:
      - writter_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: writter-app
    restart: unless-stopped
    ports:
      - "8000:8000"
      - "5173:5173"
    volumes:
      - .:/var/www/html
    environment:
      APP_NAME: Writter
      APP_ENV: local
      APP_DEBUG: "true"
      APP_URL: http://localhost:8000
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_DATABASE: writter
      DB_USERNAME: writter
      DB_PASSWORD: writter_secret
      VITE_APP_NAME: Writter
      VITE_DEV_SERVER_URL: http://localhost:5173
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  writter_mysql_data:
